buildscript {
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
    }
}

plugins {
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'jacoco'
}


test {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
}

dependencies {
    api project(':studyflow-facade')
    implementation("org.springframework.boot:spring-boot-starter-web:${springBootVersion}")
    implementation("org.springframework.boot:spring-boot-starter-actuator:${springBootVersion}")
    implementation("org.springframework.boot:spring-boot-starter-data-jpa:${springBootVersion}")
    implementation("org.springframework.security.oauth:spring-security-oauth2:${springSecurityOauth2Version}")
    implementation("org.springframework.security:spring-security-jwt:${springSecurityJwtVersion}")
    implementation("org.mariadb.jdbc:mariadb-java-client:${mariaDbVersion}")
    testImplementation("org.springframework.boot:spring-boot-starter-test:${springBootVersion}")
    testImplementation('org.spockframework:spock-core:2.3-groovy-3.+')
    testImplementation('org.codehaus.groovy:groovy-all:3.+')
    testImplementation('org.junit.jupiter:junit-jupiter-api:5.+')
    testImplementation('org.junit.jupiter:junit-jupiter-engine:5.+')
    testImplementation('org.mockito:mockito-core:4.+')
    testImplementation('org.mockito:mockito-junit-jupiter:4.+')
    testImplementation('com.h2database:h2:1.4.200')
}